<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09150f">
<title>Budborne: W Canvas 001 Demo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09150f;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
</style>
</head>
<body>
<canvas id="world" aria-label="Budborne W canvas 001 capability demo"></canvas>
<script>
const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d",{alpha:false});

const state={
  view:{w:0,h:0,dpr:1},
  W:{layout:0},
  pointer:{x:0,y:0,down:false,inside:false},
  rect:{x:0,y:0,w:0,h:0}
};

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const lerp=(a,b,t)=>a+(b-a)*t;

function solveViewport(){
  const w=Math.max(1,window.innerWidth);
  const h=Math.max(1,window.innerHeight);
  const dpr=clamp(window.devicePixelRatio||1,1,3);

  state.view={w,h,dpr};

  canvas.width=Math.round(w*dpr);
  canvas.height=Math.round(h*dpr);
  canvas.style.width=w+"px";
  canvas.style.height=h+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  const aspect=w/h;
  state.W.layout=clamp((aspect-.58)/(1.65-.58),0,1);

  const u=Math.min(w,h)/100;
  const rw=clamp(lerp(72,54,state.W.layout)*u,160,w-32);
  const rh=clamp(lerp(32,46,state.W.layout)*u,110,h-32);

  state.rect={
    x:(w-rw)/2,
    y:(h-rh)/2,
    w:rw,
    h:rh
  };

  hitTest();
}

function hitTest(){
  const r=state.rect,p=state.pointer;
  p.inside=p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}

function pointerPosition(e){
  const rect=canvas.getBoundingClientRect();
  state.pointer.x=e.clientX-rect.left;
  state.pointer.y=e.clientY-rect.top;
  hitTest();
}

canvas.addEventListener("pointerdown",e=>{
  pointerPosition(e);
  state.pointer.down=true;
  canvas.setPointerCapture?.(e.pointerId);
});
canvas.addEventListener("pointermove",pointerPosition);
canvas.addEventListener("pointerup",e=>{
  pointerPosition(e);
  state.pointer.down=false;
});
canvas.addEventListener("pointercancel",()=>state.pointer.down=false);

function draw(){
  const {w,h}=state.view;
  const r=state.rect;
  const p=state.pointer;
  const active=p.down&&p.inside;

  ctx.fillStyle="#09150f";
  ctx.fillRect(0,0,w,h);

  ctx.fillStyle=active?"#bce77f":"#6ea85b";
  ctx.fillRect(r.x,r.y,r.w,r.h);

  ctx.lineWidth=2;
  ctx.strokeStyle="#dff6a9";
  ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1);

  ctx.fillStyle="#dfe9d7";
  ctx.font="700 12px system-ui,-apple-system,sans-serif";
  ctx.textAlign="left";
  ctx.textBaseline="top";
  ctx.fillText("BUDBORNE · W CANVAS 001 · CURRENT CAPABILITIES",16,16);

  ctx.fillStyle="#819487";
  ctx.font="600 11px ui-monospace,SFMono-Regular,Menlo,monospace";
  ctx.fillText("VIEW "+Math.round(w)+"×"+Math.round(h)+"  DPR "+state.view.dpr.toFixed(2),16,36);
  ctx.fillText("W.layout "+state.W.layout.toFixed(3),16,53);
  ctx.fillText("RECT "+Math.round(r.w)+"×"+Math.round(r.h)+" @ "+Math.round(r.x)+","+Math.round(r.y),16,70);
  ctx.fillText("POINTER "+Math.round(p.x)+","+Math.round(p.y)+"  inside "+p.inside+"  down "+p.down,16,87);

  const y=Math.max(112,h-92);
  ctx.fillStyle="#dfe9d7";
  ctx.font="700 11px system-ui,-apple-system,sans-serif";
  ctx.fillText("TRY ONLY WHAT EXISTS:",16,y);

  ctx.fillStyle="#819487";
  ctx.font="600 11px system-ui,-apple-system,sans-serif";
  ctx.fillText("1. Touch and hold the rectangle.",16,y+18);
  ctx.fillText("2. Drag in and out while holding.",16,y+35);
  ctx.fillText("3. Rotate or resize the screen.",16,y+52);

  requestAnimationFrame(draw);
}

window.addEventListener("resize",solveViewport,{passive:true});
window.visualViewport?.addEventListener("resize",solveViewport,{passive:true});

solveViewport();
requestAnimationFrame(draw);
</script>
</body>
</html>
