<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132a20"><title>Budborne: First Seed</title>
<style>:root{color-scheme:dark;--soil:#132a20;--leaf:#a8d66d;--cream:#f4edcf;--mud:#253d2e}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 20%,#294b34,var(--soil) 55%);color:var(--cream);font:16px system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:20px}main{width:min(520px,100%);text-align:center}.brand{letter-spacing:.25em;font-weight:900;font-size:.8rem;opacity:.75}.card{margin-top:14px;background:#0b1711cc;border:1px solid #ffffff1c;border-radius:28px;padding:24px;box-shadow:0 22px 70px #0008}h1{font-size:clamp(2.2rem,11vw,4rem);margin:.1em 0}.sub{opacity:.72;margin-top:-8px}.plot{height:255px;display:grid;place-items:end center;padding-bottom:26px;position:relative;overflow:hidden}.plot:after{content:"";position:absolute;bottom:0;width:80%;height:55px;background:#503c28;border-radius:50%}.bud{z-index:1;font-size:92px;filter:drop-shadow(0 12px 8px #0006);transform-origin:50% 100%}.bud.happy{animation:bop .45s ease}@keyframes bop{50%{transform:scale(1.12) rotate(-4deg)}}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--mud);padding:10px;border-radius:14px}.stat b{display:block;font-size:1.15rem}button{width:100%;margin-top:10px;padding:15px;border:0;border-radius:16px;background:var(--leaf);color:#102014;font-weight:900;font-size:1rem;touch-action:manipulation}button.secondary{background:#314c3a;color:var(--cream)}#msg{min-height:44px;margin:15px 0 5px;display:grid;place-items:center}.tiny{font-size:.75rem;opacity:.5;margin-top:18px}</style></head>
<body><main><div class="brand">BUDBORNE</div><div class="card"><h1>First Seed 🌱</h1><p class="sub">Creature Zero is awake.</p><div class="plot"><div id="bud" class="bud">🌱</div></div><div class="stats"><div class="stat"><span>Growth</span><b id="growth">0</b></div><div class="stat"><span>Care</span><b id="care">0</b></div><div class="stat"><span>Days</span><b id="days">1</b></div></div><div id="msg">A stubborn little shoot pushes through the soil.</div><button id="water">💧 Water</button><button id="sun" class="secondary">☀️ Give Sun</button></div><div class="tiny">Nothing here is on-chain. Yet. First we prove it's worth caring about.</div>
<script>const S=JSON.parse(localStorage.getItem("budborne:first-seed")||'{"growth":0,"care":0,"days":1}');const $=id=>document.getElementById(id),messages=["It wiggles. Probably a good sign.","A new leaf uncurls.","It leans toward you.","Tiny roots grip the soil.","Something is growing."];function draw(){$("growth").textContent=S.growth;$("care").textContent=S.care;$("days").textContent=S.days;$("bud").textContent=S.growth>=12?"🌿":"🌱";localStorage.setItem("budborne:first-seed",JSON.stringify(S))}function act(kind){S.care++;S.growth+=kind==="water"?2:1;if(S.care%5===0)S.days++;$("msg").textContent=messages[Math.floor(Math.random()*messages.length)];$("bud").classList.remove("happy");void $("bud").offsetWidth;$("bud").classList.add("happy");draw()}$("water").onclick=()=>act("water");$("sun").onclick=()=>act("sun");draw();</script></main></body></html>
