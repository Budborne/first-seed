<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09150f">
<title>Budborne: W Canvas</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09150f;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100dvh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
</style>
</head>
<body>
<canvas id="world" aria-label="Budborne W canvas"></canvas>
<script type="module" src="./engine/w.js?v=004"></script>
<script>
const __wCanvas=document.getElementById("world");
["contextmenu","dblclick","dragstart","selectstart"].forEach(type=>{
  __wCanvas.addEventListener(type,e=>e.preventDefault(),{passive:false});
});
__wCanvas.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
__wCanvas.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
</script>
</body>
</html>
